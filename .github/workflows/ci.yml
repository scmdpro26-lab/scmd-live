name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Sử dụng installer script thông minh để tránh lỗi tarfile trên Windows 3.12
        python scratch/install_requirements.py

    - name: Run Unit & Integration Tests
      env:
        PYTHONIOENCODING: "utf-8"
        QT_QPA_PLATFORM: "offscreen"
        WEB_TOKEN: "admin_secret"
      run: |
        python scratch/test_event_broker.py
        python scratch/test_memory_store.py
        python scratch/test_priority_queue.py
        python scratch/test_vmc_client.py
        python scratch/test_web_server.py
        python scratch/test_web_server_websocket.py
        python scratch/test_facebook_webhook.py
        python scratch/test_order_management.py
        python scratch/test_tiktok_webcast.py
        python scratch/test_local_xtts.py
        python scratch/test_low_stock_safeguard.py
        python scratch/test_autopilot_levels.py
        python scratch/test_cross_sell.py
        python scratch/test_auto_clip.py
        python scratch/test_sentiment_analysis.py
        python scratch/test_multi_platform_restream.py
        python scratch/test_analytics.py
        python scratch/test_ai_director_minigame.py
        python scratch/test_ai_moderation.py
        python scratch/test_spam_and_moderation.py
        python scratch/test_vmc_custom_triggers.py
        python scratch/test_vnyan_health_check.py
        python scratch/test_compliance_and_lipsync.py











